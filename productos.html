<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo de productos de cosmética natural.">
  <title>Productos | Luzia Cosmética Natural</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="shop-page">
  <header class="site-header">
    <div class="container site-header__content">
      <a class="site-logo" href="index.html" aria-label="Luzia Cosmética Natural, inicio"><img src="assets/logo/luzia-logo.png" alt="Luzia Cosmética Natural" width="1024" height="341"></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-navigation"><span class="menu-toggle__label">Menú</span><span class="menu-toggle__lines" aria-hidden="true"></span></button>
      <nav class="site-nav" id="main-navigation" aria-label="Navegación principal">
        <ul class="site-nav__list">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="productos.html" aria-current="page">Tienda</a></li>
          <li><a href="mayoristas.html">Mayoristas</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container page-content shop-catalog">
    <header class="page-heading shop-heading">
      <h1>Productos</h1>
      <p>Descubrí nuestra selección de cosmética natural.</p>
    </header>
    <nav class="shop-filters" aria-label="Filtrar productos por categoría">
      <div class="shop-filters__list" role="group" aria-label="Categorías">
        <button class="shop-filter is-active" type="button" data-category="Todos" aria-pressed="true">Todos</button>
        <button class="shop-filter" type="button" data-category="Facial" aria-pressed="false">Facial</button>
        <button class="shop-filter" type="button" data-category="Corporal" aria-pressed="false">Corporal</button>
        <button class="shop-filter" type="button" data-category="Cabello" aria-pressed="false">Cabello</button>
        <button class="shop-filter" type="button" data-category="Bienestar" aria-pressed="false">Bienestar</button>
        <button class="shop-filter" type="button" data-category="Jabones" aria-pressed="false">Jabones</button>
      </div>
    </nav>
    <section class="shop-results" aria-labelledby="catalog-title">
      <h2 id="catalog-title" class="visually-hidden">Catálogo</h2>
      <div id="productos-container" class="shop-collections" aria-live="polite" aria-busy="true">
        <p>Cargando productos...</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__main"><a class="site-logo site-logo--footer" href="index.html" aria-label="Luzia Cosmética Natural, inicio"><img src="assets/logo/luzia-logo.png" alt="Luzia Cosmética Natural" width="1024" height="341"></a><nav aria-label="Navegación del pie de página"><ul class="footer-nav"><li><a href="productos.html">Tienda</a></li><li><a href="mayoristas.html">Mayoristas</a></li><li><a href="nosotros.html">Nosotros</a></li><li><a href="contacto.html">Contacto</a></li></ul></nav></div>
    <div class="container site-footer__bottom"><p>&copy; <span data-current-year></span> Luzia Cosmética Natural</p><p>Hecho con cuidado</p></div>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
